# ── Fiscal format (DB canonical) ──────────────────────────────────────────────

fiscal:
  year_format:    "FY YYYY"       # e.g. FY 2026
  quarter_format: "FY YYYY QN"   # e.g. FY 2026 Q1
  quarters:       [Q1, Q2, Q3, Q4]


# ── Product aliases ────────────────────────────────────────────────────────────
# Keys are upper-cased user phrases.
# Values are the canonical product name in t6_arr_contract at the specified level.
# Format: "CANONICAL_NAME" (level is inferred by the pipeline from the product hierarchy).
#
# L1 products (top-level families):
#   ZIA, ZPA, Digital Experience, Data Security, Security for AI,
#   Agentic SecOps, ZT Cloud, ZT Branch, ZT Browser, ZT Cell, ZS-FLEX,
#   Business Continuity, Support, EOL
#
# User aliases are mapped to canonical L1 (or deeper) product names.

product_aliases:
  # ZIA — Zscaler Internet Access (L1)
  ZIA:                              ZIA
  "ZSCALER INTERNET ACCESS":        ZIA
  "INTERNET ACCESS":                ZIA
  ZWS:                              ZIA      # ZWS = web security suite, routes to ZIA
  "WEB SECURITY":                   ZIA
  "SECURE WEB GATEWAY":             SWG      # L2 under ZIA
  SWG:                              SWG
  "WEB GATEWAY":                    SWG

  # ZPA — Zscaler Private Access (L1)
  ZPA:                              ZPA
  "ZSCALER PRIVATE ACCESS":         ZPA
  "PRIVATE ACCESS":                 ZPA
  ZTNA:                             ZPA      # ZTNA is the ZPA capability
  "ZERO TRUST NETWORK ACCESS":      ZPA

  # Digital Experience (L1) — ZDX is at L3 under this family
  ZDX:                              ZDX      # L3 under Digital Experience
  "ZSCALER DIGITAL EXPERIENCE":     "Digital Experience"
  "DIGITAL EXPERIENCE":             "Digital Experience"
  DEM:                              ZDX
  "DIGITAL EXPERIENCE MONITORING":  ZDX

  # Data Security (L1)
  "DATA SECURITY":                  "Data Security"
  DLP:                              "Data Security"   # DLP is a key component of Data Security
  CASB:                             CASB              # L3 under Data Security
  DSPM:                             DSPM              # L2 under Data Security

  # Security for AI (L1)
  "SECURITY FOR AI":                "Security for AI"
  "AI SECURITY":                    "Security for AI"
  "AI GUARD":                       "AI Guard"
  "AI GUARD FOR USERS":             "AI Guard for Users"

  # Agentic SecOps (L1)
  "AGENTIC SECOPS":                 "Agentic SecOps"

  # ZT products (L1)
  "ZT CLOUD":                       "ZT Cloud"
  ZCP:                              "ZT Cloud"         # ZCP maps to ZT Cloud family
  "CLOUD PROTECTION":               "ZT Cloud"
  "ZSCALER CLOUD PROTECTION":       "ZT Cloud"
  "ZT BRANCH":                      "ZT Branch"
  "ZT BROWSER":                     "ZT Browser"
  "ZT CELL":                        "ZT Cell"

  # ZS-FLEX (L1)
  "ZS-FLEX":                        "ZS-FLEX"
  "ZS FLEX":                        "ZS-FLEX"
  FLEX:                             "ZS-FLEX"

  # Other
  MAPS:                             MAPS
  PLATFORM:                         "ZT Cloud"
  ZCC:                              ZCC
  ZCON:                             ZCON
  "PROFESSIONAL SERVICES":          Support
  PS:                               Support
  "BUSINESS CONTINUITY":            "Business Continuity"


