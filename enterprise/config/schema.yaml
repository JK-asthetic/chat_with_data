# ═══════════════════════════════════════════════════════════════════════════════
# Zscaler ARR Analytics — Schema Configuration
# Table DDL and column definitions live in core/mdl.py (MDL catalog).
# This file holds routing, aliases, hierarchy, fiscal, and product config only.
# Verified against live DB — 2026-11-03
# ═══════════════════════════════════════════════════════════════════════════════


# ── Metric → primary table mapping ───────────────────────────────────────────

metric_table_map:
  ARR:       data_arr
  INCR_ARR:  data_inc_arr
  ACV:       data_acv
  NNACV:     data_acv
  NACV:      data_nacv_target
  CHURN:     data_inc_arr
  QTY:       data_quantity


# ── Geo aliases — maps user phrase → canonical label used for matching ─────────
# Values here are matched by the spaCy extractor (single string per alias).
# Multi-geo expansion (e.g. Americas → AMS ECE + AMS MPH) is in geo_expand below.

geo_aliases:
  AMERICAS: Americas
  AMER:     Americas
  AMERICA:  Americas
  AMS:      Americas
  APJ:      APJ
  APAC:     APJ
  APJC:     APJ
  EMEA:     EMEA


# ── Geo expansion — canonical label → actual t6_arr_contract geo column values ─
# geo column is cfy_geo level: AMS ECE, AMS MPH, APJ, EMEA, etc.
# When a user says "Americas" or "AMS", both AMS ECE and AMS MPH should be queried.

geo_expand:
  Americas: [AMS ECE, AMS MPH]
  APJ:      [APJ]
  EMEA:     [EMEA]


