# ── Order type aliases ────────────────────────────────────────────────────────
# Maps raw user phrase → canonical carve_split_type value used in data_acv / mrr_order_type in data_arr.
# Canonical values for data_acv.carve_split_type:
#   Renewal, Upsell, Expansion, New, NEW_CUST, NEW_L1_PRODUCT..NEW_L5_PRODUCT
# Canonical values for data_arr.mrr_order_type: New, Renewal, Upsell

order_type_aliases:
  # Renewal
  RENEWAL:              Renewal
  RENEWALS:             Renewal
  RENEW:                Renewal
  RENEWING:             Renewal

  # Upsell / Expansion
  UPSELL:               Upsell
  UPSELLS:              Upsell
  "UP-SELL":            Upsell
  EXPANSION:            Expansion
  EXPAND:               Expansion
  EXPANDING:            Expansion

  # New Logo / New Customer — maps to carve_split_type = 'NEW_CUST'
  "NEW LOGO":           NEW_CUST
  "NEW LOGOS":          NEW_CUST
  "NEW CUSTOMER":       NEW_CUST
  "NEW CUSTOMERS":      NEW_CUST
  "NEW BUSINESS":       NEW_CUST
  "NEW CUST":           NEW_CUST
  "NEW ACCOUNTS":       NEW_CUST
  "NEW ACCOUNT":        NEW_CUST
  "NET NEW CUSTOMER":   NEW_CUST
  "LAND":               NEW_CUST    # "land and expand" land = new logo

  # New to Product — maps to carve_split_type = 'NEW_L1_PRODUCT'
  "NEW TO PRODUCT":     NEW_L1_PRODUCT
  "NEW PRODUCT":        NEW_L1_PRODUCT
  "NEW TO L1":          NEW_L1_PRODUCT
  "CROSS SELL":         NEW_L1_PRODUCT
  "CROSS-SELL":         NEW_L1_PRODUCT

  # Generic "new" — catch-all new business (not renewal)
  "NEW ARR":            New
  "NEW DEALS":          New


# ── Metric definitions ────────────────────────────────────────────────────────

metrics:
  ARR:
    table:   data_arr
    col:     arr
    variant: snapshot
  INCR_ARR:
    table:   data_inc_arr
    col:     arr_change
    variant: delta
  ACV:
    table:   data_acv
    col:     adjusted_acv
    variant: snapshot
  NNACV:
    table:   data_acv
    col:     adjusted_acv
    variant: nnacv             # triggers carve_split_type NOT IN ('Renewal') filter
  NACV:
    table:   data_nacv_target
    col:     target
    variant: snapshot
  CHURN:
    table:   data_inc_arr
    col:     downsell
    variant: downsell          # SUM(downsell) — always negative, represents ARR lost
  QTY:
    table:   data_quantity
    col:     product_l1_qty
    variant: snapshot          # always filter fiscal_month_m_of_quarter = 'M3'


# ── Product hierarchy ──────────────────────────────────────────────────────────
# L1 families with known L2 sub-products (from t6_arr_contract DISTINCT queries).
# Used by the pipeline to resolve product hierarchy depth.

product_hierarchy:
  ZIA:
    level: L1
    l2_values: [SWG, Firewall, CASB, Sandbox, "Endpoint Context"]
  ZPA:
    level: L1
    l2_values: ["Private Access", Segmentation, "Privileged Remote Access", B2B]
  "Digital Experience":
    level: L1
    l2_values: ["Digital Experience", "Digital Experience Standard"]
  "Data Security":
    level: L1
    l2_values: ["Core DLP", DSPM, "SaaS Security", "App Protection", "Data Security Standard"]
  "Security for AI":
    level: L1
    l2_values: ["Protect AI Systems", "Secure AI Interaction", "Discover AI Risk"]
  "Agentic SecOps":
    level: L1
    l2_values: ["Agentic SecOps Core", MDR, "Threat Hunting", Deception]
  "ZT Cloud":
    level: L1
    l2_values: ["ZT Workloads", "ZT Microsegmentation", "ZT Workloads Gateway", "ZT Workloads Standard"]
  "ZT Branch":
    level: L1
    l2_values: ["ZT Branch", "ZT Branch Standard"]
  "ZT Browser":
    level: L1
    l2_values: ["ZT Browser", "ZT Browser Standard"]
  "ZS-FLEX":
    level: L1
    l2_values: ["ZS-FLEX"]
  "Business Continuity":
    level: L1
    l2_values: ["Business Continuity"]
  Support:
    level: L1
    l2_values: [Support]
