# pop_db schema — data_arr + dim_account scope
# Verified against live DB 2026-10-22

tables:
  data_arr:
    display_name: "ARR Fact Table"
    description: "Annual Recurring Revenue by account, product, geo, and time period. ~1.8M rows."
    metric_col: arr
    metric_agg: SUM
    account_name_col: end_user_name          # individual company — use this for account queries
    account_id_col: account_id
    parent_name_col: end_user_parent_name    # parent/rollup entity
    parent_id_col: end_user_parent_id
    geo_col: end_user_parent_geo             # CORRECT column; values: Americas / APJ / EMEA
    fy_col: fiscal_year                      # format: 'FY 2026'  (never 'FY26')
    fq_col: fiscal_quarter                   # format: 'FY 2026 Q1'  (never 'Q1FY26')
    segment_col: market_segment
    product_cols:
      l1: product_l1
      l2: product_l2
      l3: product_l3
    # Columns to expose in the SQLCoder prompt (minimal, no sensitive cols)
    query_columns:
      - end_user_name
      - end_user_parent_name
      - end_user_parent_id
      - end_user_parent_geo
      - fiscal_year
      - fiscal_quarter
      - arr
      - market_segment
      - mrr_order_type
      - product_l1
      - product_l2
      - product_l3
      - product_l4
      - product_l5
      - account_id
    join_to_dim:
      table: dim_account
      fact_key: account_id
      dim_key: account_id

  dim_account:
    display_name: "Account Dimension"
    description: "Account master with geo, segment, owner, and ARR snapshot. ~188k rows."
    account_id_col: account_id
    account_name_col: account_name
    parent_id_col: end_user_parent_id
    parent_name_col: end_user_parent_name
    search_cols: [account_name, end_user_parent_name]  # used for fuzzy company search
    query_columns:
      - account_id
      - account_name
      - end_user_parent_id
      - end_user_parent_name
      - geo                     # geo column in dim (values: Americas / APJ / EMEA)
      - market_segment
      - industry
      - arr
      - ae
      - tsm
      - renewal_date
      - zs_rank_by_arr

