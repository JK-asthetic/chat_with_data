# Order type raw → data_arr.mrr_order_type value (Renewal / Upsell / New).
# A bare "new" is NOT an alias: "new ARR" / "new logo" already mean the incremental-ARR metric / DELTA intent.
order_type_aliases:
  RENEWAL: Renewal
  RENEWALS: Renewal
  RENEW: Renewal
  RENEWS: Renewal
  RENEWED: Renewal
  RENEWING: Renewal
  UPSELL: Upsell
  UPSELLS: Upsell
  UPSELLING: Upsell
  UPSOLD: Upsell
  "UP-SELL": Upsell
  "UP SELL": Upsell
  "NEW BUSINESS": New
  "NEW ORDER": New
  "NEW ORDERS": New
  "NEW BOOKING": New
  "NEW BOOKINGS": New

# Metric name → table + column + default variant
metrics:
  ARR:
    table:   data_arr
    col:     arr
    variant: snapshot
  INCR_ARR:
    table:   data_arr
    col:     arr
    variant: delta
  ACV:
    table:   data_arr
    col:     arr
    variant: snapshot
  CHURN:
    table:   data_arr
    col:     arr
    variant: downsell

# Product hierarchy — known l2 values per l1 (from data_arr DISTINCT queries)
# Used by Tool 1 to set deepest_level when user specifies sub-products
product_hierarchy:
  ZIA:  { l2_values: [] }
  ZPA:  { l2_values: [] }
  ZDX:  { l2_values: [] }
  ZCP:  { l2_values: [] }
  ZEC:  { l2_values: [] }
  MAPS: { l2_values: [] }
  Platform:  { l2_values: [] }
  Bundles:   { l2_values: [] }
