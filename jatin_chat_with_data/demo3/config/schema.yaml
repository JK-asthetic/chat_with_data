# Fiscal format (DB canonical)
fiscal:
  year_format: "FY YYYY"          # e.g., FY 2026
  quarter_format: "FY YYYY QN"   # e.g., FY 2026 Q1
  quarters: [Q1, Q2, Q3, Q4]

# Zscaler product name → product_l1 value in data_arr
# Keys are upper-cased user aliases; values are exact DB values.
# If a product maps to product_l2 instead, prefix key with "l2:".
# Run: SELECT DISTINCT product_l1 FROM data_arr ORDER BY 1; to refresh this list.
product_aliases:
  ZIA: ZIA
  "ZSCALER INTERNET ACCESS": ZIA
  "INTERNET ACCESS": ZIA
  ZPA: ZPA
  "ZSCALER PRIVATE ACCESS": ZPA
  "PRIVATE ACCESS": ZPA
  ZDX: ZDX
  "ZSCALER DIGITAL EXPERIENCE": ZDX
  "DIGITAL EXPERIENCE": ZDX
  ZCP: ZCP
  "ZSCALER CLOUD PROTECTION": ZCP
  "CLOUD PROTECTION": ZCP
  ZEC: ZEC
  ZTNA: ZPA          # ZTNA is the ZPA capability
  MAPS: MAPS
  PLATFORM: Platform
  BUNDLES: Bundles
  BUNDLE: Bundles
  "PROFESSIONAL SERVICES": "Professional Services"
  PS: "Professional Services"
  ZCC: ZCC
  ZCON: ZCON
  ZWS: ZIA           # ZWS is the web security suite, routes to ZIA product line
  # SWG is a level-2 hierarchy value (ZIA > SWG), not an l1 product: resolved via the DB hierarchy.
  "SECURE WEB GATEWAY": SWG
  "WEB GATEWAY": SWG
  "WEB SECURITY": ZIA
  DEM: ZDX
  "DIGITAL EXPERIENCE MONITORING": ZDX
  "ZERO TRUST NETWORK ACCESS": ZPA

